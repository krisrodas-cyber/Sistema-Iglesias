<!-- Barra superior reutilizable; los datos del usuario se insertan desde topbar.js. -->
<div class="topbar">
  <button id="sidebar-toggle" class="btn topbar__menu-button" type="button" aria-label="Abrir navegación" aria-expanded="false"><i class="bi bi-list"></i></button>
  <span class="topbar__context">Plataforma de administración</span>
  <div class="user-account">
    <span class="user-account__avatar" id="avatar-initials" aria-hidden="true">US</span>
    <div class="user-account__details">
      <strong id="user-name">Cargando usuario</strong>
      <span id="user-email">—</span>
      <small id="topbar-user-role">Usuario</small>
      <small id="assigned-parish" class="d-none"></small>
    </div>
    <button id="sign-out-button" class="btn sign-out-button" type="button"><i class="bi bi-box-arrow-right" aria-hidden="true"></i><span>Cerrar sesión</span></button>
  </div>
</div>
