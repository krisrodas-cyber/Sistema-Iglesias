<!-- Vista dinámica del módulo de Administración de Sacerdotes. -->
<template id="view-template">
  <section class="priests-view" aria-labelledby="priests-title">
    <header class="view-header priests-view__header">
      <div><p class="section-label">Administración</p><h1 id="priests-title">Administración de Sacerdotes</h1><p>Registro y consulta de los sacerdotes de la Arquidiócesis de Los Altos.</p></div>
      <button id="new-priest-button" class="btn priest-primary-button" type="button" data-bs-toggle="modal" data-bs-target="#priest-modal"><i class="bi bi-plus-lg" aria-hidden="true"></i><span>Nuevo sacerdote</span></button>
    </header>
    <div id="priest-error" class="alert priest-error d-none" role="alert" aria-live="assertive"></div>
    <section class="priest-table-card" aria-label="Listado de sacerdotes">
      <div class="priest-table-card__toolbar">
        <div class="search-field"><i class="bi bi-search" aria-hidden="true"></i><input id="priest-search" class="form-control" type="search" placeholder="Buscar sacerdotes" aria-label="Buscar sacerdotes"></div>
        <div class="priest-filters"><select id="priest-clergy-filter" class="form-select" aria-label="Filtrar por tipo de clero"><option value="">Todos los tipos</option><option value="Diocesano">Diocesano</option><option value="Religioso">Religioso</option></select><select id="priest-ministry-filter" class="form-select" aria-label="Filtrar por estado ministerial"><option value="">Todos los estados ministeriales</option><option value="Activo">Activo</option><option value="Retirado">Retirado</option><option value="Suspendido">Suspendido</option><option value="Fallecido">Fallecido</option></select><select id="priest-record-filter" class="form-select" aria-label="Filtrar por estado del registro"><option value="">Todos los registros</option><option value="true">Activos</option><option value="false">Inactivos</option></select></div>
      </div>
      <div class="priest-table-card__meta"><span id="priest-count">0 registros</span><span>Resultados actualizados</span></div>
      <div id="priest-loader" class="priest-loader" role="status"><span class="spinner-border spinner-border-sm" aria-hidden="true"></span><span>Cargando sacerdotes...</span></div>
      <div id="priest-empty-state" class="priest-empty-state d-none"><i class="bi bi-person-vcard" aria-hidden="true"></i><p>No existen sacerdotes registrados.</p></div>
      <div id="priest-table-wrapper" class="table-responsive d-none"><table class="table priest-table align-middle mb-0"><thead><tr><th>Código</th><th>Nombre completo</th><th>Tipo de clero</th><th>Congregación</th><th>Teléfono</th><th>Estado ministerial</th><th>Registro</th><th class="text-end">Acciones</th></tr></thead><tbody id="priest-table-body"></tbody></table></div>
      <nav id="priest-pagination" class="priest-pagination d-none" aria-label="Paginación de sacerdotes"></nav>
    </section>
  </section>

  <div id="priest-modal" class="modal fade" tabindex="-1" aria-labelledby="priest-modal-title" aria-hidden="true"><div class="modal-dialog modal-xl modal-dialog-scrollable"><div class="modal-content priest-modal"><div class="modal-header"><div><p class="section-label">Registro</p><h2 id="priest-modal-title">Nuevo sacerdote</h2></div><button class="btn-close" type="button" data-bs-dismiss="modal" aria-label="Cerrar"></button></div><form id="priest-form" class="needs-validation" novalidate><div class="modal-body"><div class="row g-3"><div class="col-md-3"><label class="form-label" for="priest-code">Código</label><p id="priest-code-auto-note" class="form-text mt-0 mb-0">El código se generará automáticamente al guardar.</p><input id="priest-code" class="form-control d-none" type="text" readonly aria-label="Código generado"></div><div class="col-md-5"><label class="form-label" for="priest-names">Nombres *</label><input id="priest-names" name="nombres" class="form-control" type="text" maxlength="120" required></div><div class="col-md-4"><label class="form-label" for="priest-surnames">Apellidos *</label><input id="priest-surnames" name="apellidos" class="form-control" type="text" maxlength="120" required></div><div class="col-md-6"><label class="form-label" for="priest-religious-name">Nombre religioso</label><input id="priest-religious-name" name="nombre_religioso" class="form-control" type="text" maxlength="150"></div><div class="col-md-3"><label class="form-label" for="priest-birth-date">Fecha de nacimiento</label><input id="priest-birth-date" name="fecha_nacimiento" class="form-control" type="date"></div><div class="col-md-3"><label class="form-label" for="priest-ordination-date">Fecha de ordenación</label><input id="priest-ordination-date" name="fecha_ordenacion" class="form-control" type="date"></div><div class="col-md-4"><label class="form-label" for="priest-clergy-type">Tipo de clero *</label><select id="priest-clergy-type" name="tipo_clero" class="form-select" required><option value="Diocesano" selected>Diocesano</option><option value="Religioso">Religioso</option></select></div><div id="priest-congregation-group" class="col-md-8 d-none"><label class="form-label" for="priest-congregation">Congregación</label><input id="priest-congregation" name="congregacion" class="form-control" type="text" maxlength="150"></div><div class="col-md-4"><label class="form-label" for="priest-phone">Teléfono</label><input id="priest-phone" name="telefono" class="form-control" type="tel" maxlength="30"></div><div class="col-md-4"><label class="form-label" for="priest-email">Correo</label><input id="priest-email" name="correo" class="form-control" type="email" maxlength="150"></div><div class="col-md-4"><label class="form-label" for="priest-nationality">Nacionalidad</label><input id="priest-nationality" name="nacionalidad" class="form-control" type="text" maxlength="80" value="Guatemalteca"></div><div class="col-md-6"><label class="form-label" for="priest-ministry-status">Estado ministerial *</label><select id="priest-ministry-status" name="estado_ministerial" class="form-select" required><option value="Activo" selected>Activo</option><option value="Retirado">Retirado</option><option value="Suspendido">Suspendido</option><option value="Fallecido">Fallecido</option></select></div><div class="col-md-6"><label class="form-label" for="priest-record-status">Estado del registro *</label><select id="priest-record-status" name="activo" class="form-select" required><option value="true" selected>Activo</option><option value="false">Inactivo</option></select></div><div class="col-12"><label class="form-label" for="priest-address">Dirección</label><input id="priest-address" name="direccion" class="form-control" type="text"></div><div class="col-12"><label class="form-label" for="priest-notes">Observaciones</label><textarea id="priest-notes" name="observaciones" class="form-control" rows="3"></textarea></div></div></div><div class="modal-footer"><button class="btn priest-secondary-button" type="button" data-bs-dismiss="modal">Cancelar</button><button id="save-priest-button" class="btn priest-primary-button" type="submit"><span>Guardar</span><span class="spinner-border spinner-border-sm d-none" aria-hidden="true"></span></button></div></form></div></div></div>
  <div id="priest-detail-modal" class="modal fade" tabindex="-1" aria-labelledby="priest-detail-title" aria-hidden="true"><div class="modal-dialog modal-lg modal-dialog-scrollable"><div class="modal-content priest-modal"><div class="modal-header"><div><p class="section-label">Consulta</p><h2 id="priest-detail-title">Detalle de sacerdote</h2></div><button class="btn-close" type="button" data-bs-dismiss="modal" aria-label="Cerrar"></button></div><div id="priest-detail-content" class="modal-body priest-details"></div><div class="modal-footer"><button class="btn priest-secondary-button" type="button" data-bs-dismiss="modal">Cerrar</button></div></div></div></div>
  <div id="priest-status-modal" class="modal fade" tabindex="-1" aria-labelledby="priest-status-title" aria-hidden="true"><div class="modal-dialog modal-dialog-centered"><div class="modal-content priest-modal"><div class="modal-header"><div><p class="section-label">Confirmación</p><h2 id="priest-status-title">Cambiar estado</h2></div><button class="btn-close" type="button" data-bs-dismiss="modal" aria-label="Cerrar"></button></div><div class="modal-body"><p id="priest-status-message" class="mb-0"></p></div><div class="modal-footer"><button class="btn priest-secondary-button" type="button" data-bs-dismiss="modal">Cancelar</button><button id="confirm-priest-status-button" class="btn priest-primary-button" type="button"><span>Confirmar</span><span class="spinner-border spinner-border-sm d-none" aria-hidden="true"></span></button></div></div></div></div>
  <div class="toast-container position-fixed bottom-0 end-0 p-3"><div id="priest-toast" class="toast priest-toast" role="status" aria-live="polite" aria-atomic="true"><div class="toast-body"><i id="priest-toast-icon" class="bi bi-check-circle-fill" aria-hidden="true"></i><span id="priest-toast-message">Operación realizada correctamente.</span><button class="btn-close" type="button" data-bs-dismiss="toast" aria-label="Cerrar"></button></div></div></div>
</template>
