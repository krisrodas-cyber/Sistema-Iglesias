<template id="view-template">
  <section class="communities-view inventory-view" aria-labelledby="inventory-title">
    <header class="view-header communities-view__header"><div><p class="section-label">Archivo institucional</p><h1 id="inventory-title">Inventario Documental</h1><p>Registro, conservación y ubicación de documentos y libros sacramentales de la Arquidiócesis de Los Altos.</p></div><button id="new-document-button" class="btn community-primary-button" type="button"><i class="bi bi-plus-lg"></i>Nuevo documento</button></header>
    <div id="inventory-error" class="alert community-error d-none" role="alert"></div>
    <div id="inventory-summary" class="inventory-summary"></div>
    <section class="community-card"><div class="community-toolbar"><div class="community-search"><i class="bi bi-search"></i><input id="inventory-search" class="form-control" type="search" placeholder="Buscar documentos"></div><div class="community-filters"><select id="inventory-parish-filter" class="form-select"><option value="">Todas las parroquias</option></select><select id="inventory-type-filter" class="form-select"><option value="">Todos los tipos</option></select><select id="inventory-conservation-filter" class="form-select"><option value="">Conservación</option></select><select id="inventory-restoration-filter" class="form-select"><option value="">Restauración</option><option value="true">Requieren restauración</option><option value="false">No requieren restauración</option></select><select id="inventory-status-filter" class="form-select"><option value="">Todos</option><option value="true">Activos</option><option value="false">Inactivos</option></select></div></div><div class="community-meta"><span id="inventory-count">0 registros</span><span>Resultados actualizados</span></div><div id="inventory-loader" class="community-loader"><span class="spinner-border spinner-border-sm"></span>Cargando documentos...</div><div id="inventory-empty" class="community-empty d-none"><i class="bi bi-archive"></i><p>No existen documentos registrados.</p></div><div id="inventory-wrapper" class="table-responsive d-none"><table class="table community-table"><thead><tr><th>Código</th><th>Tipo</th><th>Título</th><th>Parroquia</th><th>Periodo o fecha</th><th>Ubicación física</th><th>Conservación</th><th>Restauración</th><th>Estado</th><th>Acciones</th></tr></thead><tbody id="inventory-table"></tbody></table></div><nav id="inventory-pagination" class="community-pagination d-none"></nav></section>
  </section>
  <div id="inventory-modal" class="modal fade" tabindex="-1"><div class="modal-dialog modal-xl modal-dialog-scrollable"><div class="modal-content community-modal"><div class="modal-header"><h2 id="inventory-modal-title">Nuevo documento</h2><button class="btn-close" type="button" data-bs-dismiss="modal"></button></div><form id="inventory-form" class="needs-validation" novalidate><div class="modal-body"><div class="row g-3"><div class="col-12"><p id="inventory-code-note" class="form-text m-0">El código se generará automáticamente al guardar.</p><input id="inventory-code" class="form-control d-none" readonly></div><div class="col-md-6"><label class="form-label">Tipo de documento *</label><select id="inventory-type" name="tipo_documento_id" class="form-select" required><option value="">Seleccione un tipo</option></select></div><div class="col-md-6"><label class="form-label">Título *</label><input name="titulo" class="form-control" maxlength="200" required></div><div class="col-md-6"><label class="form-label">Número o referencia</label><input name="numero_referencia" class="form-control"></div><div class="col-md-6"><label class="form-label">Fecha del documento</label><input name="fecha_documento" class="form-control" type="date"></div><div class="col-12"><label class="form-label">Descripción</label><textarea name="descripcion" class="form-control"></textarea></div><div class="col-md-4"><label class="form-label">Parroquia *</label><select id="inventory-parish" name="parroquia_id" class="form-select" required><option value="">Seleccione una parroquia</option></select></div><div class="col-md-4"><label class="form-label">Comunidad</label><select id="inventory-community" name="comunidad_id" class="form-select" disabled><option value="">Sin comunidad</option></select></div><div class="col-md-4"><label class="form-label">Capilla</label><select id="inventory-chapel" name="capilla_id" class="form-select" disabled><option value="">Sin capilla</option></select></div><div class="col-md-6"><label class="form-label">Ubicación física *</label><input name="ubicacion_fisica" class="form-control" required></div><div class="col-md-6"><label class="form-label">Custodio responsable</label><input name="custodio_responsable" class="form-control"></div><div class="col-md-4"><label class="form-label">Estado de conservación *</label><select id="inventory-conservation" name="estado_conservacion_id" class="form-select" required><option value="">Seleccione</option></select></div><div class="col-md-4"><label class="form-label">Nivel de acceso *</label><select id="inventory-access" name="nivel_acceso_id" class="form-select" required><option value="">Seleccione</option></select></div><div class="col-md-4"><label class="form-label">Requiere restauración</label><select name="requiere_restauracion" class="form-select"><option value="false" selected>No</option><option value="true">Sí</option></select></div><section id="sacramental-control" class="col-12 d-none"><h3 class="inventory-section-title">Control del libro sacramental</h3><div class="row g-3"><div class="col-md-3"><label class="form-label">Número de libro</label><input name="numero_libro" class="form-control"></div><div class="col-md-3"><label class="form-label">Tomo</label><input name="tomo" class="form-control"></div><div class="col-md-3"><label class="form-label">Fecha inicial *</label><input id="inventory-start" name="fecha_inicio_registros" class="form-control" type="date"></div><div class="col-md-3"><label class="form-label">Fecha final *</label><input id="inventory-end" name="fecha_fin_registros" class="form-control" type="date"></div><div class="col-md-3"><label class="form-label">Folio inicial</label><input id="inventory-folio-start" name="folio_inicial" class="form-control" type="number"></div><div class="col-md-3"><label class="form-label">Folio final</label><input id="inventory-folio-end" name="folio_final" class="form-control" type="number"></div><div class="col-md-3"><label class="form-label">Partida inicial</label><input id="inventory-entry-start" name="partida_inicial" class="form-control" type="number"></div><div class="col-md-3"><label class="form-label">Partida final</label><input id="inventory-entry-end" name="partida_final" class="form-control" type="number"></div><div class="col-md-4"><label class="form-label">Total de folios</label><input name="total_folios" class="form-control" type="number" min="0"></div><div class="col-md-4"><label class="form-label">Encuadernado</label><select name="encuadernado" class="form-select"><option value="">Sin información</option><option value="true">Sí</option><option value="false">No</option></select></div><div class="col-md-4"><label class="form-label">Tiene índice</label><select name="tiene_indice" class="form-select"><option value="">Sin información</option><option value="true">Sí</option><option value="false">No</option></select></div></div></section><div class="col-12"><label class="form-label">Observaciones</label><textarea name="observaciones" class="form-control"></textarea></div><div class="col-md-4"><label class="form-label">Estado</label><select name="estado" class="form-select"><option value="true" selected>Activo</option><option value="false">Inactivo</option></select></div></div></div><div class="modal-footer"><button class="btn community-secondary-button" type="button" data-bs-dismiss="modal">Cancelar</button><button id="inventory-save" class="btn community-primary-button"><span>Guardar</span><span class="spinner-border spinner-border-sm d-none"></span></button></div></form></div></div></div>
  <div id="inventory-toast-container" class="toast-container position-fixed bottom-0 end-0 p-3"><div id="inventory-toast" class="toast"><div class="toast-body"><i id="inventory-toast-icon" class="bi bi-check-circle-fill"></i><span id="inventory-toast-message"></span></div></div></div>
</template>
