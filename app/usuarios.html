<template id="view-template"><section class="communities-view"><header class="view-header"><div><p class="section-label">Administración</p><h1>Administración de Usuarios</h1><p>Gestión de accesos, perfiles y roles del sistema.</p></div><button id="new-user" class="btn community-primary-button" type="button"><i class="bi bi-plus-lg"></i>Nuevo usuario</button></header><div id="users-alert" class="alert community-error d-none" role="alert"></div><div id="users-summary" class="inventory-summary"></div><div id="users-loader" class="community-loader d-none"><span class="spinner-border spinner-border-sm"></span>Cargando usuarios...</div><div class="community-card table-responsive"><table class="table community-table"><thead><tr><th>Nombre completo</th><th>Correo</th><th>Rol</th><th>Estado</th><th>Fecha</th><th>Acciones</th></tr></thead><tbody id="users-table"></tbody></table></div></section><div id="user-modal" class="modal fade" tabindex="-1"><div class="modal-dialog modal-lg modal-dialog-scrollable"><div class="modal-content community-modal"><div class="modal-header"><h2 id="user-modal-title">Nuevo usuario</h2><button class="btn-close" type="button" data-bs-dismiss="modal"></button></div><form id="user-form" class="needs-validation" novalidate><div class="modal-body"><div class="row g-3"><div class="col-md-6"><label class="form-label">Nombre *</label><input name="nombre" class="form-control" required></div><div class="col-md-6"><label class="form-label">Apellido *</label><input name="apellido" class="form-control" required></div><div id="user-email-group" class="col-12"><label class="form-label">Correo electrónico *</label><input name="email" type="email" class="form-control" required></div><div class="col-md-6"><label class="form-label">Rol *</label><select name="rol_id" class="form-select" required><option value="1">Administrador</option><option value="2">Secretario</option><option value="3">Consulta</option><option value="4">Obispo</option></select></div><div id="user-password-group" class="col-md-6"><label class="form-label">Contraseña temporal *</label><div class="input-group"><input id="user-password" name="password" type="password" class="form-control" minlength="10" required><button id="toggle-user-password" class="btn community-secondary-button" type="button"><i class="bi bi-eye"></i></button></div><small class="form-text">Mínimo 10 caracteres.</small></div><div id="user-active-group" class="col-12"><label><input name="activo" type="checkbox" checked> Usuario activo</label></div></div></div><div class="modal-footer"><button class="btn community-secondary-button" type="button" data-bs-dismiss="modal">Cancelar</button><button id="user-save" class="btn community-primary-button" type="submit"><span>Guardar</span><span class="spinner-border spinner-border-sm d-none"></span></button></div></form></div></div></div><div id="user-confirm-modal" class="modal fade" tabindex="-1"><div class="modal-dialog modal-dialog-centered"><div class="modal-content community-modal"><div class="modal-header"><h2 id="user-confirm-title">Confirmar acción</h2><button class="btn-close" type="button" data-bs-dismiss="modal"></button></div><div id="user-confirm-message" class="modal-body"></div><div class="modal-footer"><button class="btn community-secondary-button" data-bs-dismiss="modal">Cancelar</button><button id="user-confirm-button" class="btn community-primary-button"><span>Confirmar</span><span class="spinner-border spinner-border-sm d-none"></span></button></div></div></div></div><div class="toast-container position-fixed bottom-0 end-0 p-3"><div id="users-toast" class="toast"><div class="toast-body"><i id="users-toast-icon" class="bi bi-check-circle-fill"></i><span id="users-toast-message"></span></div></div></div></template>
