<!-- Vista dinámica del módulo de Asignaciones Sacerdotales. -->
<template id="view-template">
  <section class="assignments-view" aria-labelledby="assignments-title">
    <header class="view-header assignments-view__header"><div><p class="section-label">Administración</p><h1 id="assignments-title">Asignaciones Sacerdotales</h1><p>Gestión de nombramientos, cargos e historial pastoral de los sacerdotes.</p></div><button id="new-assignment-button" class="btn assignment-primary-button" type="button"><i class="bi bi-plus-lg" aria-hidden="true"></i><span>Nueva asignación</span></button></header>
    <div id="assignment-error" class="alert assignment-error d-none" role="alert" aria-live="assertive"></div>
    <section class="assignment-table-card" aria-label="Listado de asignaciones"><div class="assignment-table-card__toolbar"><div class="assignment-search"><i class="bi bi-search" aria-hidden="true"></i><input id="assignment-search" class="form-control" type="search" placeholder="Buscar asignaciones" aria-label="Buscar asignaciones"></div><div class="assignment-filters"><select id="assignment-priest-filter" class="form-select" aria-label="Filtrar por sacerdote"><option value="">Todos los sacerdotes</option></select><select id="assignment-parish-filter" class="form-select" aria-label="Filtrar por parroquia"><option value="">Todas las parroquias</option></select><select id="assignment-position-filter" class="form-select" aria-label="Filtrar por cargo"><option value="">Todos los cargos</option></select><select id="assignment-status-filter" class="form-select" aria-label="Filtrar por estado"><option value="">Todas</option><option value="Vigente">Vigentes</option><option value="Próxima">Próximas</option><option value="Finalizada">Finalizadas</option></select></div></div><div class="assignment-table-card__meta"><span id="assignment-count">0 registros</span><span>Resultados actualizados</span></div><div id="assignment-loader" class="assignment-loader" role="status"><span class="spinner-border spinner-border-sm" aria-hidden="true"></span><span>Cargando asignaciones...</span></div><div id="assignment-empty-state" class="assignment-empty-state d-none"><i class="bi bi-arrow-left-right" aria-hidden="true"></i><p>No existen asignaciones registradas.</p></div><div id="assignment-table-wrapper" class="table-responsive d-none"><table class="table assignment-table align-middle mb-0"><thead><tr><th>Sacerdote</th><th>Parroquia</th><th>Cargo</th><th>Inicio</th><th>Finalización</th><th>Estado</th><th>Decreto</th><th class="text-end">Acciones</th></tr></thead><tbody id="assignment-table-body"></tbody></table></div><nav id="assignment-pagination" class="assignment-pagination d-none" aria-label="Paginación de asignaciones"></nav></section>
  </section>
  <div id="assignment-modal" class="modal fade" tabindex="-1" aria-labelledby="assignment-modal-title" aria-hidden="true"><div class="modal-dialog modal-lg modal-dialog-scrollable"><div class="modal-content assignment-modal"><div class="modal-header"><div><p class="section-label">Nombramiento</p><h2 id="assignment-modal-title">Nueva asignación</h2></div><button class="btn-close" type="button" data-bs-dismiss="modal" aria-label="Cerrar"></button></div><form id="assignment-form" class="needs-validation" novalidate><div class="modal-body"><div class="row g-3"><div class="col-md-6"><label class="form-label" for="assignment-priest">Sacerdote *</label><select id="assignment-priest" name="sacerdote_id" class="form-select" required><option value="">Seleccione un sacerdote</option></select></div><div class="col-md-6"><label class="form-label" for="assignment-parish">Parroquia *</label><select id="assignment-parish" name="parroquia_id" class="form-select" required><option value="">Seleccione una parroquia</option></select></div><div class="col-md-6"><label class="form-label" for="assignment-position">Cargo *</label><select id="assignment-position" name="cargo_id" class="form-select" required><option value="">Seleccione un cargo</option></select></div><div class="col-md-3"><label class="form-label" for="assignment-start">Fecha de inicio *</label><input id="assignment-start" name="fecha_inicio" class="form-control" type="date" required></div><div class="col-md-3"><label class="form-label" for="assignment-end">Fecha de finalización</label><input id="assignment-end" name="fecha_fin" class="form-control" type="date"></div><div class="col-md-6"><label class="form-label" for="assignment-decree">Número de decreto</label><input id="assignment-decree" name="numero_decreto" class="form-control" type="text" maxlength="100"></div><div class="col-12"><label class="form-label" for="assignment-notes">Observaciones</label><textarea id="assignment-notes" name="observaciones" class="form-control" rows="3"></textarea></div></div></div><div class="modal-footer"><button class="btn assignment-secondary-button" type="button" data-bs-dismiss="modal">Cancelar</button><button id="save-assignment-button" class="btn assignment-primary-button" type="submit"><span>Guardar</span><span class="spinner-border spinner-border-sm d-none" aria-hidden="true"></span></button></div></form></div></div></div>
  <div id="assignment-detail-modal" class="modal fade" tabindex="-1" aria-labelledby="assignment-detail-title" aria-hidden="true"><div class="modal-dialog modal-lg modal-dialog-scrollable"><div class="modal-content assignment-modal"><div class="modal-header"><div><p class="section-label">Consulta</p><h2 id="assignment-detail-title">Detalle de asignación</h2></div><button class="btn-close" type="button" data-bs-dismiss="modal" aria-label="Cerrar"></button></div><div id="assignment-detail-content" class="modal-body assignment-details"></div><div class="modal-footer"><button class="btn assignment-secondary-button" type="button" data-bs-dismiss="modal">Cerrar</button></div></div></div></div>
  <div id="assignment-finish-modal" class="modal fade" tabindex="-1" aria-labelledby="assignment-finish-title" aria-hidden="true"><div class="modal-dialog modal-dialog-centered"><div class="modal-content assignment-modal"><div class="modal-header"><div><p class="section-label">Confirmación</p><h2 id="assignment-finish-title">Finalizar asignación</h2></div><button class="btn-close" type="button" data-bs-dismiss="modal" aria-label="Cerrar"></button></div><div class="modal-body"><p id="assignment-finish-message"></p><label class="form-label" for="assignment-finish-date">Fecha de finalización *</label><input id="assignment-finish-date" class="form-control" type="date" required><label class="form-label mt-3" for="assignment-finish-notes">Observación</label><textarea id="assignment-finish-notes" class="form-control" rows="2"></textarea><div id="assignment-finish-error" class="alert assignment-error d-none mt-3 mb-0" role="alert"></div></div><div class="modal-footer"><button class="btn assignment-secondary-button" type="button" data-bs-dismiss="modal">Cancelar</button><button id="confirm-assignment-finish-button" class="btn assignment-primary-button" type="button"><span>Finalizar</span><span class="spinner-border spinner-border-sm d-none" aria-hidden="true"></span></button></div></div></div></div>
  <div id="assignment-warning-modal" class="modal fade" tabindex="-1" aria-labelledby="assignment-warning-title" aria-hidden="true"><div class="modal-dialog modal-dialog-centered"><div class="modal-content assignment-modal"><div class="modal-header"><div><p class="section-label">Confirmación</p><h2 id="assignment-warning-title">Confirmar operación</h2></div><button class="btn-close" type="button" data-bs-dismiss="modal" aria-label="Cerrar"></button></div><div class="modal-body"><p id="assignment-warning-message" class="mb-0"></p></div><div class="modal-footer"><button class="btn assignment-secondary-button" type="button" data-bs-dismiss="modal">Cancelar</button><button id="confirm-assignment-warning-button" class="btn assignment-primary-button" type="button">Confirmar</button></div></div></div></div>
  <div class="toast-container position-fixed bottom-0 end-0 p-3"><div id="assignment-toast" class="toast assignment-toast" role="status" aria-live="polite" aria-atomic="true"><div class="toast-body"><i id="assignment-toast-icon" class="bi bi-check-circle-fill" aria-hidden="true"></i><span id="assignment-toast-message">Operación realizada correctamente.</span><button class="btn-close" type="button" data-bs-dismiss="toast" aria-label="Cerrar"></button></div></div></div>
</template>
