<!-- Vista dinámica del módulo de Administración de Comunidades. -->
<template id="view-template">
  <section class="communities-view" aria-labelledby="communities-title"><header class="view-header communities-view__header"><div><p class="section-label">Administración</p><h1 id="communities-title">Administración de Comunidades</h1><p>Registro y consulta de las comunidades pertenecientes a las parroquias de la Diócesis de Quetzaltenango.</p></div><button id="new-community-button" class="btn community-primary-button" type="button"><i class="bi bi-plus-lg" aria-hidden="true"></i><span>Nueva comunidad</span></button></header><div id="community-error" class="alert community-error d-none" role="alert" aria-live="assertive"></div><section class="community-card"><div class="community-toolbar"><div class="community-search"><i class="bi bi-search"></i><input id="community-search" class="form-control" type="search" placeholder="Buscar comunidades" aria-label="Buscar comunidades"></div><div class="community-filters"><select id="community-parish-filter" class="form-select"><option value="">Todas las parroquias</option></select><select id="community-type-filter" class="form-select"><option value="">Todos los tipos</option><option>Comunidad</option><option>Aldea</option><option>Cantón</option><option>Barrio</option><option>Zona</option><option>Caserío</option><option>Sector</option><option>Otro</option></select><select id="community-municipality-filter" class="form-select"><option value="">Todos los municipios</option></select><select id="community-status-filter" class="form-select"><option value="">Todas</option><option value="true">Activas</option><option value="false">Inactivas</option></select></div></div><div class="community-meta"><span id="community-count">0 registros</span><span>Resultados actualizados</span></div><div id="community-loader" class="community-loader" role="status"><span class="spinner-border spinner-border-sm"></span><span>Cargando comunidades...</span></div><div id="community-empty" class="community-empty d-none"><i class="bi bi-houses"></i><p>No existen comunidades registradas.</p></div><div id="community-table-wrapper" class="table-responsive d-none"><table class="table community-table align-middle mb-0"><thead><tr><th>Código</th><th>Nombre</th><th>Tipo</th><th>Parroquia</th><th>Municipio</th><th>Responsable</th><th>Estado</th><th class="text-end">Acciones</th></tr></thead><tbody id="community-table-body"></tbody></table></div><nav id="community-pagination" class="community-pagination d-none" aria-label="Paginación"></nav></section></section>
  <div id="community-modal" class="modal fade" tabindex="-1" aria-labelledby="community-modal-title"><div class="modal-dialog modal-lg modal-dialog-scrollable"><div class="modal-content community-modal"><div class="modal-header"><div><p class="section-label">Registro</p><h2 id="community-modal-title">Nueva comunidad</h2></div><button class="btn-close" type="button" data-bs-dismiss="modal"></button></div><form id="community-form" class="needs-validation" novalidate><div class="modal-body"><div class="row g-3"><div class="col-md-4"><label class="form-label" for="community-code">Código</label><p id="community-code-auto-note" class="form-text mt-0 mb-0">El código se generará automáticamente al guardar.</p><input id="community-code" class="form-control d-none" type="text" readonly aria-label="Código generado"></div><div class="col-md-8"><label class="form-label" for="community-parish">Parroquia *</label><select id="community-parish" name="parroquia_id" class="form-select" required><option value="">Seleccione una parroquia</option></select></div><div class="col-md-8"><label class="form-label" for="community-name">Nombre *</label><input id="community-name" name="nombre" class="form-control" maxlength="150" required></div><div class="col-md-4"><label class="form-label" for="community-type">Tipo *</label><select id="community-type" name="tipo" class="form-select" required><option selected>Comunidad</option><option>Aldea</option><option>Cantón</option><option>Barrio</option><option>Zona</option><option>Caserío</option><option>Sector</option><option>Otro</option></select></div><div class="col-md-6"><label class="form-label" for="community-municipality">Municipio *</label><input id="community-municipality" name="municipio" class="form-control" maxlength="100" required></div><div class="col-md-6"><label class="form-label" for="community-responsible">Responsable</label><input id="community-responsible" name="responsable" class="form-control" maxlength="150"></div><div class="col-12"><label class="form-label" for="community-address">Dirección o referencia</label><input id="community-address" name="direccion" class="form-control"></div><div class="col-md-4"><label class="form-label" for="community-phone">Teléfono</label><input id="community-phone" name="telefono" class="form-control" maxlength="30"></div><div class="col-md-4"><label class="form-label" for="community-email">Correo</label><input id="community-email" name="correo" class="form-control" type="email" maxlength="150"></div><div class="col-md-4"><label class="form-label" for="community-date">Fecha de creación</label><input id="community-date" name="fecha_creacion" class="form-control" type="date"></div><div class="col-md-6"><label class="form-label" for="community-status">Estado *</label><select id="community-status" name="estado" class="form-select" required><option value="true" selected>Activa</option><option value="false">Inactiva</option></select></div><div class="col-12"><label class="form-label" for="community-notes">Observaciones</label><textarea id="community-notes" name="observaciones" class="form-control" rows="3"></textarea></div></div></div><div class="modal-footer"><button class="btn community-secondary-button" type="button" data-bs-dismiss="modal">Cancelar</button><button id="save-community-button" class="btn community-primary-button" type="submit"><span>Guardar</span><span class="spinner-border spinner-border-sm d-none"></span></button></div></form></div></div></div>
  <div id="community-detail-modal" class="modal fade" tabindex="-1"><div class="modal-dialog modal-lg modal-dialog-scrollable"><div class="modal-content community-modal"><div class="modal-header"><h2>Detalle de comunidad</h2><button class="btn-close" type="button" data-bs-dismiss="modal"></button></div><div id="community-detail" class="modal-body"></div><div class="modal-footer"><button class="btn community-secondary-button" type="button" data-bs-dismiss="modal">Cerrar</button></div></div></div></div>
  <div id="community-status-modal" class="modal fade" tabindex="-1"><div class="modal-dialog modal-dialog-centered"><div class="modal-content community-modal"><div class="modal-header"><h2 id="community-status-title">Cambiar estado</h2><button class="btn-close" type="button" data-bs-dismiss="modal"></button></div><div class="modal-body"><p id="community-status-message"></p></div><div class="modal-footer"><button class="btn community-secondary-button" type="button" data-bs-dismiss="modal">Cancelar</button><button id="confirm-community-status" class="btn community-primary-button" type="button"><span>Confirmar</span><span class="spinner-border spinner-border-sm d-none"></span></button></div></div></div></div>
  <div class="toast-container position-fixed bottom-0 end-0 p-3"><div id="community-toast" class="toast community-toast"><div class="toast-body"><i id="community-toast-icon" class="bi bi-check-circle-fill"></i><span id="community-toast-message"></span><button class="btn-close" data-bs-dismiss="toast"></button></div></div></div>
</template>
