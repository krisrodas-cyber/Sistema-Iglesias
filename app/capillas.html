<!-- Vista dinámica: conserva los identificadores técnicos del módulo capillas. -->
<template id="view-template">
  <section class="communities-view" aria-labelledby="chapels-title"><header class="view-header communities-view__header"><div><p class="section-label">Administración</p><h1 id="chapels-title">Administración de Comunidades con oratorios</h1><p>Registro y consulta de las comunidades con oratorios de la Arquidiócesis de Los Altos.</p></div><button id="new-chapel" class="btn community-primary-button" type="button"><i class="bi bi-plus-lg"></i>Nueva comunidad con oratorio</button></header><div id="chapel-error" class="alert community-error d-none"></div><section class="community-card"><div class="community-toolbar"><div class="community-search"><i class="bi bi-search"></i><input id="chapel-search" class="form-control" type="search" placeholder="Buscar comunidades con oratorios" aria-label="Buscar comunidades con oratorios"></div><div class="community-filters"><select id="chapel-parish-filter" class="form-select"><option value="">Todas las parroquias</option></select><select id="chapel-community-filter" class="form-select"><option value="">Todos los movimientos y pastorales</option></select><select id="chapel-type-filter" class="form-select"><option value="">Todos los tipos</option><option>Capilla</option><option>Oratorio</option><option>Santuario</option><option>Ermita</option><option>Templo</option><option>Otro</option></select><select id="chapel-municipality-filter" class="form-select"><option value="">Todos los municipios</option></select><select id="chapel-status-filter" class="form-select"><option value="">Todas</option><option value="true">Activas</option><option value="false">Inactivas</option></select></div></div><div class="community-meta"><span id="chapel-count">0 registros</span><span>Resultados actualizados</span></div><div id="chapel-loader" class="community-loader"><span class="spinner-border spinner-border-sm"></span>Cargando comunidades con oratorios...</div><div id="chapel-empty" class="community-empty d-none"><i class="bi bi-building"></i><p>No existen comunidades con oratorios registradas.</p></div><div id="chapel-wrapper" class="table-responsive d-none"><table class="table community-table"><thead><tr><th>Código</th><th>Nombre</th><th>Tipo</th><th>Parroquia</th><th>Movimiento o Pastoral</th><th>Municipio</th><th>Responsable</th><th>Estado</th><th>Acciones</th></tr></thead><tbody id="chapel-table"></tbody></table></div><nav id="chapel-pagination" class="community-pagination d-none"></nav></section></section>
  <div id="chapel-modal" class="modal fade" tabindex="-1"><div class="modal-dialog modal-lg modal-dialog-scrollable"><div class="modal-content community-modal"><div class="modal-header"><h2 id="chapel-modal-title">Nueva comunidad con oratorio</h2><button class="btn-close" data-bs-dismiss="modal"></button></div><form id="chapel-form" class="needs-validation" novalidate><div class="modal-body"><div class="row g-3"><div class="col-md-4"><label class="form-label" for="chapel-code">Código</label><p id="chapel-code-auto-note" class="form-text mt-0 mb-0">El código se generará automáticamente al guardar.</p><input id="chapel-code" class="form-control d-none" type="text" readonly aria-label="Código generado"></div><div class="col-md-8"><label class="form-label">Parroquia *</label><select id="chapel-parish" name="parroquia_id" class="form-select" required><option value="">Seleccione una parroquia</option></select></div><div class="col-md-6"><label class="form-label">Movimiento o Pastoral</label><select id="chapel-community" name="comunidad_id" class="form-select" disabled><option value="">Sin movimiento o pastoral / dependencia directa</option></select></div><div class="col-md-6"><label class="form-label">Nombre *</label><input name="nombre" class="form-control" maxlength="150" required></div><div class="col-md-4"><label class="form-label">Tipo *</label><select name="tipo" class="form-select" required><option selected>Capilla</option><option>Oratorio</option><option>Santuario</option><option>Ermita</option><option>Templo</option><option>Otro</option></select></div><div class="col-md-8"><label class="form-label">Patrono o advocación</label><input name="patrono" class="form-control"></div><div class="col-12"><label class="form-label">Dirección o referencia</label><input name="direccion" class="form-control"></div><div class="col-md-6"><label class="form-label">Municipio *</label><input id="chapel-municipality" name="municipio" class="form-control" required></div><div class="col-md-6"><label class="form-label">Responsable</label><input name="responsable" class="form-control"></div><div class="col-md-4"><label class="form-label">Teléfono</label><input name="telefono" class="form-control"></div><div class="col-md-4"><label class="form-label">Fecha de construcción</label><input id="chapel-built" name="fecha_construccion" class="form-control" type="date"></div><div class="col-md-4"><label class="form-label">Fecha de reconocimiento</label><input id="chapel-recognition" name="fecha_reconocimiento" class="form-control" type="date"></div><div class="col-md-6"><label class="form-label">Capacidad aproximada</label><input id="chapel-capacity" name="capacidad_aproximada" class="form-control" type="number" min="0" step="1"></div><div class="col-md-6"><label class="form-label">Estado *</label><select name="estado" class="form-select"><option value="true" selected>Activa</option><option value="false">Inactiva</option></select></div><div class="col-12"><label class="form-label">Observaciones</label><textarea name="observaciones" class="form-control" rows="3"></textarea></div></div></div><div class="modal-footer"><button class="btn community-secondary-button" type="button" data-bs-dismiss="modal">Cancelar</button><button id="chapel-save" class="btn community-primary-button" type="submit"><span>Guardar</span><span class="spinner-border spinner-border-sm d-none"></span></button></div></form></div></div></div>
  <div id="chapel-detail-modal" class="modal fade" tabindex="-1"><div class="modal-dialog modal-lg"><div class="modal-content community-modal"><div class="modal-header"><h2>Detalle de comunidad con oratorio</h2><button class="btn-close" data-bs-dismiss="modal"></button></div><div id="chapel-detail" class="modal-body"></div><div class="modal-footer"><button class="btn community-secondary-button" data-bs-dismiss="modal">Cerrar</button></div></div></div></div><div id="chapel-status-modal" class="modal fade" tabindex="-1"><div class="modal-dialog"><div class="modal-content community-modal"><div class="modal-header"><h2 id="chapel-status-title">Cambiar estado</h2><button class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body"><p id="chapel-status-message"></p></div><div class="modal-footer"><button class="btn community-secondary-button" data-bs-dismiss="modal">Cancelar</button><button id="chapel-confirm" class="btn community-primary-button"><span>Confirmar</span><span class="spinner-border spinner-border-sm d-none"></span></button></div></div></div></div><div class="toast-container position-fixed bottom-0 end-0 p-3"><div id="chapel-toast" class="toast community-toast"><div class="toast-body"><i id="chapel-toast-icon" class="bi bi-check-circle-fill"></i><span id="chapel-toast-message"></span><button class="btn-close" data-bs-dismiss="toast"></button></div></div></div>
</template>
