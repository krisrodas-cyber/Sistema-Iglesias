<!-- Vista dinámica del módulo de Administración de Parroquias. -->
<template id="view-template">
  <section class="parishes-view" aria-labelledby="parishes-title">
    <header class="view-header parishes-view__header">
      <div><p class="section-label">Administración</p><h1 id="parishes-title">Administración de Parroquias</h1><p>Registro y consulta de las parroquias de la Arquidiócesis de Los Altos.</p></div>
      <button id="new-parish-button" class="btn parish-primary-button" type="button" data-bs-toggle="modal" data-bs-target="#parish-modal"><i class="bi bi-plus-lg" aria-hidden="true"></i><span>Nueva parroquia</span></button>
    </header>

    <div id="parish-error" class="alert parish-error d-none" role="alert" aria-live="assertive"></div>
    <section class="parish-table-card" aria-label="Listado de parroquias">
      <div class="parish-table-card__toolbar">
        <div class="search-field"><i class="bi bi-search" aria-hidden="true"></i><input id="parish-search" class="form-control" type="search" placeholder="Buscar parroquias" aria-label="Buscar parroquias"></div>
        <div class="parish-filters"><select id="parish-deanery-filter" class="form-select" aria-label="Filtrar por decanato"><option value="">Todos los decanatos</option><option value="__unassigned__">Sin decanato asignado</option></select><select id="parish-municipality-filter" class="form-select" aria-label="Filtrar por municipio"><option value="">Todos los municipios</option></select><select id="parish-status-filter" class="form-select" aria-label="Filtrar por estado"><option value="">Todos los estados</option><option value="true">Activas</option><option value="false">Inactivas</option></select></div>
      </div>
      <div class="parish-table-card__meta"><span id="parish-count">0 registros</span><span>Resultados actualizados</span></div>
      <div id="parish-loader" class="parish-loader" role="status"><span class="spinner-border spinner-border-sm" aria-hidden="true"></span><span>Cargando parroquias...</span></div>
      <div id="parish-empty-state" class="parish-empty-state d-none"><i class="bi bi-bank2" aria-hidden="true"></i><p>No existen parroquias registradas.</p></div>
      <div id="parish-table-wrapper" class="table-responsive d-none"><table class="table parish-table align-middle mb-0"><thead><tr><th>Código</th><th>Nombre</th><th>Patrono</th><th>Decanato</th><th>Municipio</th><th>Teléfono</th><th>Estado</th><th class="text-end">Acciones</th></tr></thead><tbody id="parish-table-body"></tbody></table></div>
      <nav id="parish-pagination" class="parish-pagination d-none" aria-label="Paginación de parroquias"></nav>
    </section>
  </section>

  <div id="parish-modal" class="modal fade" tabindex="-1" aria-labelledby="parish-modal-title" aria-hidden="true"><div class="modal-dialog modal-lg modal-dialog-scrollable"><div class="modal-content parish-modal"><div class="modal-header"><div><p class="section-label">Registro</p><h2 id="parish-modal-title">Nueva parroquia</h2></div><button class="btn-close" type="button" data-bs-dismiss="modal" aria-label="Cerrar"></button></div><form id="parish-form" class="needs-validation" novalidate><div class="modal-body"><div class="row g-3"><div class="col-md-4"><label class="form-label" for="parish-code">Código</label><p id="parish-code-auto-note" class="form-text mt-0 mb-0">El código se generará automáticamente al guardar.</p><input id="parish-code" class="form-control d-none" type="text" readonly aria-label="Código generado"></div><div class="col-md-8"><label class="form-label" for="parish-name">Nombre *</label><input id="parish-name" name="nombre" class="form-control" type="text" maxlength="150" required></div><div class="col-md-6"><label class="form-label" for="parish-patron">Patrono</label><input id="parish-patron" name="patrono" class="form-control" type="text" maxlength="150"></div><div class="col-md-6"><label class="form-label" for="parish-foundation-date">Fecha de fundación</label><input id="parish-foundation-date" name="fecha_fundacion" class="form-control" type="date"></div><div class="col-12"><label class="form-label" for="parish-address">Dirección</label><input id="parish-address" name="direccion" class="form-control" type="text"></div><div class="col-md-6"><label class="form-label" for="parish-municipality">Municipio *</label><input id="parish-municipality" name="municipio" class="form-control" type="text" maxlength="100" required></div><div class="col-md-6"><label class="form-label" for="parish-department">Departamento *</label><input id="parish-department" name="departamento" class="form-control" type="text" maxlength="100" value="Quetzaltenango" required></div><div class="col-md-6"><label class="form-label" for="parish-phone">Teléfono</label><input id="parish-phone" name="telefono" class="form-control" type="tel" maxlength="30"></div><div class="col-md-6"><label class="form-label" for="parish-email">Correo</label><input id="parish-email" name="correo" class="form-control" type="email" maxlength="150"></div><div class="col-md-6"><label class="form-label" for="parish-status">Estado *</label><select id="parish-status" name="estado" class="form-select" required><option value="true" selected>Activa</option><option value="false">Inactiva</option></select></div><div class="col-12"><label class="form-label" for="parish-notes">Observaciones</label><textarea id="parish-notes" name="observaciones" class="form-control" rows="3"></textarea></div></div></div><div class="modal-footer"><button class="btn parish-secondary-button" type="button" data-bs-dismiss="modal">Cancelar</button><button id="save-parish-button" class="btn parish-primary-button" type="submit"><span>Guardar</span><span class="spinner-border spinner-border-sm d-none" aria-hidden="true"></span></button></div></form></div></div></div>

  <div id="parish-detail-modal" class="modal fade" tabindex="-1" aria-labelledby="parish-detail-title" aria-hidden="true"><div class="modal-dialog modal-lg modal-dialog-scrollable"><div class="modal-content parish-modal"><div class="modal-header"><div><p class="section-label">Consulta</p><h2 id="parish-detail-title">Detalle de parroquia</h2></div><button class="btn-close" type="button" data-bs-dismiss="modal" aria-label="Cerrar"></button></div><div id="parish-detail-content" class="modal-body parish-details"></div><div class="modal-footer"><button class="btn parish-secondary-button" type="button" data-bs-dismiss="modal">Cerrar</button></div></div></div></div>

  <div id="parish-status-modal" class="modal fade" tabindex="-1" aria-labelledby="parish-status-title" aria-hidden="true"><div class="modal-dialog modal-dialog-centered"><div class="modal-content parish-modal"><div class="modal-header"><div><p class="section-label">Confirmación</p><h2 id="parish-status-title">Cambiar estado</h2></div><button class="btn-close" type="button" data-bs-dismiss="modal" aria-label="Cerrar"></button></div><div class="modal-body"><p id="parish-status-message" class="mb-0"></p></div><div class="modal-footer"><button class="btn parish-secondary-button" type="button" data-bs-dismiss="modal">Cancelar</button><button id="confirm-parish-status-button" class="btn parish-primary-button" type="button"><span>Confirmar</span><span class="spinner-border spinner-border-sm d-none" aria-hidden="true"></span></button></div></div></div></div>

  <div class="toast-container position-fixed bottom-0 end-0 p-3"><div id="parish-toast" class="toast parish-toast" role="status" aria-live="polite" aria-atomic="true"><div class="toast-body"><i id="parish-toast-icon" class="bi bi-check-circle-fill" aria-hidden="true"></i><span id="parish-toast-message">Operación realizada correctamente.</span><button class="btn-close" type="button" data-bs-dismiss="toast" aria-label="Cerrar"></button></div></div></div>
</template>
